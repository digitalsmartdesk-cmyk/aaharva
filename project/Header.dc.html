<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { text-decoration: none; }
  </style>
</helmet>
<header style="display:flex; align-items:center; justify-content:space-between; gap:24px; padding:14px 40px; background:oklch(0.99 0.006 80); border-bottom:1px solid oklch(0.9 0.018 80); font-family:'Work Sans',sans-serif; position:sticky; top:0; z-index:50;">
  <a href="Home.dc.html" style="display:flex; align-items:center; gap:12px;">
    <img src="uploads/Logo.png" alt="Aaharva" style="width:42px; height:42px; border-radius:10px; object-fit:cover; flex-shrink:0;" />
    <span style="font-family:'Source Serif 4',serif; font-size:22px; font-weight:600; color:oklch(0.3 0.06 145); letter-spacing:0.2px;">Aaharva</span>
  </a>
  <nav style="display:flex; align-items:center; gap:8px;">
    <sc-if value="{{isHome}}" hint-placeholder-val="{{ false }}">
      <a href="Home.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:600; color:oklch(0.3 0.06 145); background:oklch(0.94 0.03 145);">Home</a>
    </sc-if>
    <sc-if value="{{isHomeOff}}" hint-placeholder-val="{{ true }}">
      <a href="Home.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:500; color:oklch(0.4 0.02 50);">Home</a>
    </sc-if>
    <sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
      <a href="Shop.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:600; color:oklch(0.3 0.06 145); background:oklch(0.94 0.03 145);">Shop</a>
    </sc-if>
    <sc-if value="{{isShopOff}}" hint-placeholder-val="{{ true }}">
      <a href="Shop.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:500; color:oklch(0.4 0.02 50);">Shop</a>
    </sc-if>
    <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
      <a href="Subscription.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:600; color:oklch(0.3 0.06 145); background:oklch(0.94 0.03 145);">Subscription</a>
    </sc-if>
    <sc-if value="{{isSubOff}}" hint-placeholder-val="{{ true }}">
      <a href="Subscription.dc.html" style="padding:8px 14px; border-radius:8px; font-size:15px; font-weight:500; color:oklch(0.4 0.02 50);">Subscription</a>
    </sc-if>
  </nav>
  <div style="display:flex; align-items:center; gap:10px;">
    <a href="Shop.dc.html" onClick="{{ onCartClick }}" style="position:relative; display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600; color:oklch(0.24 0.02 50); border:1px solid oklch(0.86 0.02 80); background:white;">
      <span>My Box</span>
      <sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute; top:-8px; right:-8px; background:oklch(0.55 0.16 30); color:white; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;">{{ cartCount }}</span>
      </sc-if>
    </a>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onCartClick&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;(e: any) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { cartCount: 0 };

  async componentDidMount() {
    const mod = await import('./data.js');
    this._mod = mod;
    this.refresh();
    this._handler = () => this.refresh();
    window.addEventListener('aaharva-cart-updated', this._handler);
  }
  componentWillUnmount() {
    if (this._handler) window.removeEventListener('aaharva-cart-updated', this._handler);
  }
  refresh() {
    if (this._mod) this.setState({ cartCount: this._mod.cartCount() });
  }

  renderVals() {
    const active = this.props.active || 'home';
    return {
      isHome: active === 'home', isHomeOff: active !== 'home',
      isShop: active === 'shop', isShopOff: active !== 'shop',
      isSub: active === 'subscription', isSubOff: active !== 'subscription',
      cartCount: this.state.cartCount,
      hasCart: this.state.cartCount > 0,
      onCartClick: this.props.onCartClick || null,
    };
  }
}

</script>
</body>
</html>
